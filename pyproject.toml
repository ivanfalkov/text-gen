[project]
name = "text-gen"
version = "0.1.0"
description = "Dialog summarization: baselines + LoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- core ---
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "pyarrow<17",
    # --- experiment tracking ---
    "clearml>=2.1.12",
    # --- data download ---
    "kaggle>=1.6",
    # --- metrics ---
    "evaluate>=0.4,<0.5",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4",
    "datasets>=3.0,<4",
    # --- notebooks ---
    "ipykernel>=6.29",
    "ipython>=8.20",
    "matplotlib>=3.9",
    # --- LLM stack (compatible with vllm 0.8.5) ---
    "torch==2.6.0",
    "transformers>=4.51.1,<4.52",
    "tokenizers>=0.21,<0.22",
    "vllm==0.8.5.post1",
    "peft>=0.13,<0.14",
    "trl>=0.12,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
